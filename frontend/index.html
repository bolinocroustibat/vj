<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="UTF-8" />
	<title>Algorithm-driven, YouTube-fed VJ</title>
	<link rel="shortcut icon" type="image/x-icon" href="https://adriencarpentier.com/style/favicon.ico" />
	<link href="styles.css" type="text/css" rel="stylesheet" />
	<script src="index.ts" type="module"></script>

</head>

<body>

	<div id="start-screen">
		<div class="start-field">
			<label for="overlay-effect-select">Overlay effect</label>
			<select id="overlay-effect-select"></select>
		</div>
		<div class="start-field">
			<label for="grayscale-select">Grayscale</label>
			<select id="grayscale-select"></select>
		</div>
		<div class="start-field">
			<label for="playback-rate-select">Playback rate</label>
			<select id="playback-rate-select"></select>
		</div>
		<button type="button" id="start-button">Start</button>
	</div>

	<img id="countdown" src="/countdown_10s.gif" alt="" aria-hidden="true" hidden>

	<div id="player1"></div>
	<div id="player2"></div>
	<div id="player3"></div>
	<div id="overlay-container"></div>

</body>

</html>
